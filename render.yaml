# Render Blueprint: one web service (backend + built frontend), live voice calls included.
services:
  - type: web
    name: sarvam-voice-agent
    runtime: docker
    plan: starter            # live calls need an always-on instance (free tier sleeps)
    healthCheckPath: /api/health
    envVars:
      - key: SARVAM_API_KEY
        sync: false          # set in the Render dashboard, never in Git
      - key: DATABASE_URL
        sync: false          # mysql+pymysql://user:pass@host:3306/db?charset=utf8mb4 (optional; SQLite is wiped on redeploy)
      - key: ICE_SERVERS
        sync: false          # optional: add a TURN server for testers on other networks
